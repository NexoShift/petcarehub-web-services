spring.application.name=petcare-hub-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.nexoshift.petcarehub.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# JWT
authorization.jwt.secret=${JWT_SECRET:change-me-in-production-this-secret-must-have-at-least-32-bytes}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Password recovery
iam.password-reset.token-validity-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
iam.password-reset.url=${PASSWORD_RESET_URL:http://localhost:4200/reset-password}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Clinical files upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Assistance - LLM
ai.llm.provider=${AI_LLM_PROVIDER:fake}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.base-url=https://api.openai.com/v1
ai.openai.model=${OPENAI_MODEL:gpt-5.4-mini}
ai.openai.timeout=10s
ai.openai.max-completion-tokens=1200

# Other bounded contexts: stub until their facades exist, then facade
ai.acl.mode=${AI_ACL_MODE:stub}

# Files (report PDFs and vision images): local now, s3 when it is ready
ai.storage.provider=${AI_STORAGE_PROVIDER:local}
ai.storage.local-dir=${AI_STORAGE_DIR:uploads}

# AI Assistance - Computer vision (SKIN: detection, RADIOGRAPH: classification)
ai.vision.provider=${AI_VISION_PROVIDER:fake}
ai.vision.skin-min-confidence=0.50
ai.vision.radiograph-min-confidence=0.20
ai.roboflow.api-key=${ROBOFLOW_API_KEY:}
ai.roboflow.base-url=${ROBOFLOW_BASE_URL:https://serverless.roboflow.com}
ai.roboflow.skin-model-id=${ROBOFLOW_SKIN_MODEL_ID:}
ai.roboflow.radiograph-model-id=${ROBOFLOW_RADIOGRAPH_MODEL_ID:}
ai.roboflow.timeout=8s

