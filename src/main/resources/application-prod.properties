# Production (Docker on Azure): every value comes from environment variables
server.port=${PORT:8080}

# Azure Database for MySQL (Flexible Server)
# Example DB_URL: jdbc:mysql://<server>.mysql.database.azure.com:3306/petcarehub?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
authorization.jwt.secret=${JWT_SECRET}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Files on Amazon S3 (the container disk is lost on every restart)
clinical-exams.storage.provider=${CLINICAL_EXAMS_STORAGE_PROVIDER:s3}
clinical-exams.storage.s3.bucket=${AWS_S3_BUCKET}
clinical-exams.storage.s3.region=${AWS_REGION:us-east-1}
ai.storage.provider=${AI_STORAGE_PROVIDER:s3}
