# Desarrollo local: MySQL de docker-compose
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcarehub?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}

# Clinical files on local disk
clinical-exams.storage.local.directory=${FILE_STORAGE_LOCAL_DIRECTORY:uploads}

# Payments go through Stripe also in development. Set SUBSCRIPTIONS_SIMULATED_PAYMENTS_ENABLED=true
# only on purpose (for example to seed demo data), then turn it off again.
subscriptions.simulated-payments.enabled=${SUBSCRIPTIONS_SIMULATED_PAYMENTS_ENABLED:false}
