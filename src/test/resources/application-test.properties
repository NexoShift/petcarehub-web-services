# Pruebas de integracion: base de datos H2 en memoria (no necesita MySQL ni docker-compose)
spring.datasource.url=jdbc:h2:mem:petcarehub-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Los tests no suben archivos a S3, pero el bean S3Client se crea igual al arrancar.
# Valores falsos (no son secretos) para que los tests corran sin variables AWS_* en la máquina.
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key

# Stripe es obligatorio para arrancar. Estos valores de prueba nunca llegan a Stripe:
# los tests usan pagos simulados o dobles de Stripe. Si defines STRIPE_SECRET_KEY y
# STRIPE_PRICE_* (modo test), las pruebas en vivo (StripeLiveIntegrationTest) usan las reales.
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.prices.pet-owner-basic=${STRIPE_PRICE_PET_OWNER_BASIC:price_test_pet_owner_basic}
stripe.prices.pet-owner-premium=${STRIPE_PRICE_PET_OWNER_PREMIUM:price_test_pet_owner_premium}
stripe.prices.clinic-basic=${STRIPE_PRICE_CLINIC_BASIC:price_test_clinic_basic}
stripe.prices.clinic-premium=${STRIPE_PRICE_CLINIC_PREMIUM:price_test_clinic_premium}
stripe.webhook.secret=whsec_test_placeholder

# Tests activate subscriptions without Stripe
subscriptions.simulated-payments.enabled=true

# Sign in with Google is required: a placeholder Client ID (the tests never call Google)
iam.google.client-ids=test-web.apps.googleusercontent.com
