# Pruebas de integracion: base de datos H2 en memoria (no necesita MySQL ni docker-compose)
spring.datasource.url=jdbc:h2:mem:petcarehub-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Los tests no suben archivos a S3, pero el bean S3Client se crea igual al arrancar.
# Valores falsos (no son secretos) para que los tests corran sin variables AWS_* en la máquina.
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key
