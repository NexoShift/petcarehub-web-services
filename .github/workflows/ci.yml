name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Stripe test-mode keys (optional). With them, StripeLiveIntegrationTest calls the real
      # Stripe API in test mode; without them those tests are skipped. Only sk_test_ keys:
      # the live tests never run with a live key. Secrets are not passed to forks.
      - name: Build and run tests
        run: ./mvnw -B verify
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PET_OWNER_BASIC: ${{ secrets.STRIPE_PRICE_PET_OWNER_BASIC }}
          STRIPE_PRICE_PET_OWNER_PREMIUM: ${{ secrets.STRIPE_PRICE_PET_OWNER_PREMIUM }}
          STRIPE_PRICE_CLINIC_BASIC: ${{ secrets.STRIPE_PRICE_CLINIC_BASIC }}
          STRIPE_PRICE_CLINIC_PREMIUM: ${{ secrets.STRIPE_PRICE_CLINIC_PREMIUM }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t petcarehub-api:ci .
